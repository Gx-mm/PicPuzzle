name: Build PicPuzzle APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Release APK
      run: gradle assembleRelease --stacktrace

    - name: Prepare APK Output
      run: |
        mkdir -p output
        find app/build/outputs/apk/ -name "*.apk" -exec cp {} output/pix.apk \;

    - name: Upload pix.apk
      uses: actions/upload-artifact@v4
      with:
        name: pix-apk-file
        path: output/pix.apk
